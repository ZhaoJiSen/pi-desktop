[package]
name = "pi-desktop"
version = "0.1.0"
description = "A desktop workspace for the pi coding agent"
edition = "2021"

[lib]
name = "pi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sys-locale = "0.3.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "system-proxy"] }
semver = "1"
scraper = "0.27"
tauri-plugin-notification = "2.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotificationSettings", "block2"] }
