<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thinking slider visual check</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const params = new URLSearchParams(location.search)
      const { useWorkspace } = await import('/src/store/workspace.ts')
      useWorkspace.setState({ language: params.get('lang') || 'en' })
      await import('/src/styles/vendor.css')
      await import('/src/styles/index.scss')
      const { createRoot } = await import('react-dom/client')
      const { createElement: h, useState } = await import('react')
      const { ModelThinkingControl } = await import('/src/components/ModelThinkingControl.tsx')
      document.documentElement.dataset.theme = params.get('theme') || 'light'
      document.documentElement.dataset.palette = 'nord'
      document.documentElement.style.zoom = params.get('zoom') || '1'
      const style = document.createElement('style')
      style.textContent =
        '.control-frame{width:344px;margin:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}'
      document.head.append(style)
      function Preview() {
        const [value, setValue] = useState(params.get('effort') || 'medium')
        return h(
          'section',
          { className: 'control-frame' },
          h(ModelThinkingControl, {
            value,
            modelName: 'Claude Sonnet',
            levels: ['low', 'medium', 'high', 'xhigh'],
            supported: true,
            disabled: false,
            focusSelected: false,
            onChange: async (level) => setValue(level),
          }),
        )
      }
      createRoot(document.getElementById('root')).render(h(Preview))
    </script>
  </body>
</html>
