<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thinking slider visual check</title></head><body><div id="root"></div><script type="module">
const params=new URLSearchParams(location.search)
if(params.has('reduced')){const nativeMatch=window.matchMedia.bind(window);window.matchMedia=query=>query==='(prefers-reduced-motion)'?{matches:true,media:query,addListener(){},removeListener(){},addEventListener(){},removeEventListener(){}}:nativeMatch(query)}
const {useWorkspace}=await import('/src/store/workspace.ts')
useWorkspace.setState({language:params.get('lang')||'en'})
let transitionFrame=0
function recordTransition(){
 cancelAnimationFrame(transitionFrame)
 const start=performance.now(),frames=[]
 document.body.dataset.transitionStatus='capturing'
 function record(){
  const control=document.querySelector('.model-thinking-control'),overlay=document.querySelector('.thinking-spectrum'),fill=document.querySelector('.thinking-fill-reveal'),track=document.querySelector('[data-slot=slider-track]')
  if(control&&fill&&track){frames.push({t:performance.now()-start,level:control.dataset.level,opacity:overlay?Number(getComputedStyle(overlay).opacity):0,overlay:!!overlay,base:getComputedStyle(fill).backgroundColor,start:getComputedStyle(track).borderInlineStartColor,end:getComputedStyle(track).borderInlineEndColor,title:document.querySelector('[data-slot=slider-output]')?.textContent});document.body.dataset.transitionSamples=JSON.stringify(frames)}
  if(performance.now()-start<700)transitionFrame=requestAnimationFrame(record)
  else document.body.dataset.transitionStatus='complete'
 }
 transitionFrame=requestAnimationFrame(record)
}
document.addEventListener('keydown',event=>{if(event.target.matches?.('.model-thinking-control input')&&['ArrowRight','ArrowLeft','End','Home'].includes(event.key))recordTransition()},true)
await import('/src/styles/vendor.css');await import('/src/styles/index.scss')
const {createRoot}=await import('react-dom/client');const {createElement:h,useState}=await import('react')
const {ModelThinkingControl}=await import('/src/components/ModelThinkingControl.tsx')
document.documentElement.dataset.theme=params.get('theme')||'light';document.documentElement.dataset.palette='nord';document.documentElement.style.zoom=params.get('zoom')||'1'
const style=document.createElement('style');style.textContent='.control-frame{width:344px;margin:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}';document.head.append(style)
function Preview(){const [value,setValue]=useState(params.get('effort')||'medium');return h('section',{className:'control-frame'},h(ModelThinkingControl,{value,modelName:params.get('model')||'Grok 4.7',levels:['low','medium','high','xhigh'],supported:true,disabled:false,focusSelected:false,onChange:async level=>setValue(level)}))}
createRoot(document.getElementById('root')).render(h(Preview))
</script></body></html>
