<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pi empty conversation mask</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const params = new URLSearchParams(location.search)
      const { useWorkspace } = await import('/src/store/workspace.ts')
      const { createPreviewSessions } = await import('/src/lib/fixtures.ts')
      const session = createPreviewSessions()[0]
      session.id = 'pi-mask-check'
      session.messages = []
      session.draft = ''
      session.draftNodes = []
      session.attachments = []
      const messages = Array.from({ length: 12 }, (_, i) => ({
        id: `message-${i}`,
        role: 'assistant',
        timestamp: Date.now(),
        blocks: [
          {
            type: 'text',
            text:
              `## Review ${i + 1}\n\n` +
              'Check the current changes and preserve the existing behavior.\n\n'.repeat(5),
          },
        ],
      }))
      useWorkspace.setState({
        sessions: [session],
        activeSessionId: session.id,
        runningSessionId: null,
        connection: 'disconnected',
        onboardingOpen: false,
        language: 'en',
        theme: params.get('theme') || 'dark',
        palette: 'nord',
      })
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F2') {
          e.preventDefault()
          useWorkspace.getState().updateSession(session.id, { messages })
        }
        if (e.key === 'F3') {
          e.preventDefault()
          useWorkspace.getState().updateSession(session.id, { messages: [] })
        }
      })
      await import('/src/styles/vendor.css')
      await import('/src/styles/index.scss')
      const { createRoot } = await import('react-dom/client')
      const { createElement: h } = await import('react')
      const { Conversation } = await import('/src/components/Conversation.tsx')
      const { Composer } = await import('/src/components/Composer.tsx')
      document.documentElement.dataset.theme = params.get('theme') || 'dark'
      document.documentElement.dataset.palette = 'nord'
      document.documentElement.style.zoom = params.get('zoom') || '1'
      const style = document.createElement('style')
      style.textContent = `body {margin:0} #root {width:min(980px,100%);height:500px;padding:18px;background:var(--rail)} .preview-frame {height:100%;border-radius:20px;background:var(--paper);display:flex} .preview-frame .chat-page {width:100%}`
      document.head.append(style)
      function Preview() {
        const empty = useWorkspace((s) => !s.sessions[0].messages.length)
        return h(
          'section',
          { className: 'preview-frame' },
          h(
            'div',
            { className: empty ? 'chat-page is-empty' : 'chat-page' },
            h(Conversation, { onProject: () => {} }),
            h('div', { className: 'composer-area' }, h(Composer)),
          ),
        )
      }
      createRoot(document.getElementById('root')).render(h(Preview))
    </script>
  </body>
</html>
