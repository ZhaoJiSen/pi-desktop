<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>主题文本选区</title
  ><style>
    body {
      margin: 28px;
      background: #18181f;
      color: #e4e4ed;
      font: 16px/1.7 system-ui;
    }
    h1 {
      font-size: 26px;
    }
    h2 {
      font-size: 18px;
    }
    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
    img {
      display: block;
      width: 100%;
      border-radius: 12px;
    }
    a {
      color: inherit;
    }
    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <h1>主题文本选区</h1>
  <p>选中背景与主题协调，保留代码语法色相。</p>
  <main>
    <section>
      <h2>Catppuccin Frappé</h2>
      <a href="catppuccin-frappe-dark.png"
        ><img src="catppuccin-frappe-dark.png" alt="Catppuccin Frappé 的代码选区"
      /></a>
    </section>
    <section>
      <h2>Catppuccin Latte</h2>
      <a href="catppuccin-light.png"
        ><img src="catppuccin-light.png" alt="Catppuccin Latte 的代码选区"
      /></a>
    </section>
    <section>
      <h2>Tokyo Night</h2>
      <a href="tokyo-night-dark.png"
        ><img src="tokyo-night-dark.png" alt="Tokyo Night 的代码选区"
      /></a>
    </section>
    <section>
      <h2>Tokyo Night Day</h2>
      <a href="tokyo-night-light.png"
        ><img src="tokyo-night-light.png" alt="Tokyo Night Day 的代码选区"
      /></a>
    </section>
    <section>
      <h2>Linear Dark</h2>
      <a href="linear-dark.png"><img src="linear-dark.png" alt="Linear Dark 的代码选区" /></a>
    </section>
    <section>
      <h2>Solarized Light</h2>
      <a href="solarized-light.png"
        ><img src="solarized-light.png" alt="Solarized Light 的代码选区"
      /></a>
    </section>
  </main>
</html>
