<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appearance settings</title></head><body><div id="root"></div>
<script type="module">
  const params = new URLSearchParams(location.search)
  const prefix = 'catppuccin-flavors:' + (params.get('run') || params.get('state') || 'light') + ':'
  let failStorage = false
  Object.defineProperty(window, 'localStorage', { value: {
    getItem: key => sessionStorage.getItem(prefix + key),
    setItem(key, value) { if (failStorage) throw new Error('Storage unavailable'); sessionStorage.setItem(prefix + key, value) },
    removeItem: key => sessionStorage.removeItem(prefix + key),
  } })
  const originalMatchMedia = window.matchMedia.bind(window)
  const systemMedia = new EventTarget()
  let systemDark = sessionStorage.getItem(prefix + 'systemDark') === 'true'
  Object.defineProperties(systemMedia, {
    matches: { get: () => systemDark },
    media: { value: '(prefers-color-scheme: dark)' },
  })
  window.matchMedia = query => query === '(prefers-color-scheme: dark)' ? systemMedia : originalMatchMedia(query)
  const { useWorkspace } = await import('/src/store/workspace.ts')
  const { createRoot } = await import('react-dom/client')
  const { createElement } = await import('react')
  const { SettingsPage } = await import('/src/pages/SettingsPage.tsx')
  const { useDesktopLifecycle } = await import('/src/hooks/useDesktopLifecycle.ts')
  await import('/src/styles/vendor.css')
  await import('/src/styles/index.scss')
  if (!sessionStorage.getItem(prefix + 'initialized')) {
    const mode = params.get('state') === 'dark' ? 'dark' : params.get('state') === 'system' ? 'system' : 'light'
    useWorkspace.setState({ language: params.get('lang') === 'en' ? 'en' : 'zh', theme: mode, palette: 'ink', palettesByMode: { light: 'ink', dark: 'ink' }, accentOverrides: {}, activeSessionId: null, runningSessionId: null, connection: 'disconnected', storageError: null })
    sessionStorage.setItem(prefix + 'initialized', '1')
  }
  document.documentElement.style.zoom = params.get('zoom') || '1'
  const style = document.createElement('style')
  style.textContent = '#root { height: 100dvh; display:flex; background:var(--paper); }'
  document.head.append(style)
  document.addEventListener('keydown', event => {
    if (event.key === 'F6') { event.preventDefault(); failStorage = true }
    if (event.key === 'F5') { event.preventDefault(); failStorage = false; useWorkspace.setState({ storageError: null }) }
    if (event.key === 'F7') { event.preventDefault(); systemDark = !systemDark; sessionStorage.setItem(prefix + 'systemDark', String(systemDark)); systemMedia.dispatchEvent(new Event('change')) }
  })
  function Preview() { useDesktopLifecycle('settings'); return createElement(SettingsPage) }
  createRoot(document.getElementById('root')).render(createElement(Preview))
</script></body></html>
