<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Usage empty layout review</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import App from '/src/App.tsx'
      import { useWorkspace } from '/src/store/workspace.ts'
      import { createPreviewSessions, previewProjects } from '/src/lib/fixtures.ts'
      import '/src/styles/vendor.css'
      import '/src/styles/index.scss'
      // This review fixture renders the real application and never writes workspace preferences.
      useWorkspace.persist.setOptions({
        storage: { getItem: () => null, setItem: () => {}, removeItem: () => {} },
      })
      const empty = createPreviewSessions()[1]
      useWorkspace.setState({
        sessions: [
          {
            ...empty,
            title: 'New chat',
            messages: [],
            usage: {
              ...empty.usage,
              input: 0,
              output: 0,
              cacheRead: 0,
              cacheWrite: 0,
              total: 0,
              cost: 0,
            },
          },
        ],
        activeSessionId: empty.id,
        projects: previewProjects,
        language: 'en',
        theme: 'dark',
      })
      createRoot(document.getElementById('root')).render(React.createElement(App))
    </script>
  </body>
</html>
