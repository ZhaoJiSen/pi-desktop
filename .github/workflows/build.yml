name: build
run-name: build ${{ inputs.version }} (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (SemVer, e.g. 0.1.0 or 0.2.0-beta.1; no v prefix)'
        required: true
        type: string

concurrency:
  group: build-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate version
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: node --experimental-strip-types scripts/validate-version.ts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript checks
        run: pnpm typecheck

      - name: Lint JavaScript and TypeScript
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test frontend
        run: pnpm verify

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build frontend
        run: pnpm build

  package:
    name: Build macOS app
    runs-on: macos-latest
    needs: checks
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal macOS bundle
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          node --experimental-strip-types scripts/write-build-config.ts
          pnpm package:mac --target universal-apple-darwin --ci --config "$RUNNER_TEMP/pi-build-config.json"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-macos-${{ inputs.version }}
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: pi-desktop-macos-${{ inputs.version }}
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ inputs.version }}
          RELEASE_ASSET_DIR: release-assets
        run: node --experimental-strip-types scripts/publish-release.ts
